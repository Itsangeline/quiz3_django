<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student List</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        background: #e8f1ed;
        margin: 0;
        padding: 40px;
        min-height: 100vh;
    }

    .container {
        max-width: 900px;
        margin: 40px auto;
        background: #ffffff;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 6px 20px rgba(60, 80, 70, 0.12);
    }

    h1 {
        text-align: center;
        color: #557a6e;
        margin-bottom: 30px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 10px;
    }

    th {
        background: #789b8e;
        color: white;
        padding: 15px;
        text-align: left;
    }

    td {
        padding: 15px;
        color: #465952;
        border-bottom: 1px solid #dce7e2;
    }

    tr:hover {
        background: #f0f6f3;
    }

    .empty {
        text-align: center;
        padding: 20px;
        color: #718078;
    }
</style>
</head>

<body>

    <div class="container">

        <h1>Student List</h1>

        {% if students %}

        <table>
            <tr>
                <th>Name</th>
                <th>Course</th>
                <th>Year Level</th>
            </tr>

            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.course }}</td>
                <td>{{ student.year_level }}</td>
            </tr>
            {% endfor %}

        </table>

        {% else %}

        <div class="empty">
            <p>No students found.</p>
        </div>

        {% endif %}

    </div>

</body>
</html>
